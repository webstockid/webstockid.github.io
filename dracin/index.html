<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Dracin Stream</title>

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<!-- Tailwind Play CDN -->
	<script src="https://cdn.tailwindcss.com"></script>

	<!-- Konfigurasi Tailwind (harus setelah CDN, sebelum body dirender) -->
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						primary: 'var(--bg-primary)',
						secondary: 'var(--bg-secondary)',
						card: 'var(--bg-card)',
						'text-main': 'var(--text-primary)',
						'text-sub': 'var(--text-secondary)',
						accent: 'var(--accent)',
						'accent-hover': 'var(--accent-hover)',
					},
					keyframes: {
						fadeIn: {
							from: { opacity: 0 },
							to: { opacity: 1 },
						},
						slideUp: {
							from: { opacity: 0, transform: 'translateY(30px)' },
							to: { opacity: 1, transform: 'translateY(0)' },
						},
						slideDown: {
							from: { opacity: 0, transform: 'translateY(-20px)' },
							to: { opacity: 1, transform: 'translateY(0)' },
						},
						fadeSlide: {
							from: { opacity: 0, transform: 'translateY(8px)' },
							to: { opacity: 1, transform: 'translateY(0)' },
						},
						slideIn: {
							from: { transform: 'scaleX(0)' },
							to: { transform: 'scaleX(1)' },
						},
					},
					animation: {
						fadeIn: 'fadeIn 0.25s ease',
						slideUp: 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
						slideDown: 'slideDown 0.3s ease',
						fadeSlide: 'fadeSlide 0.3s ease',
						slideIn: 'slideIn 0.25s ease',
					},
				},
			},
			safelist: [
				'bg-accent',
				'text-white',
				'bg-white/5',
				'hover:bg-white/10',
				'grid-cols-2',
				'sm:grid-cols-3',
				'lg:grid-cols-5',
				'xl:grid-cols-6',
				'active',
				'hidden',
				'flex',
			],
		};
	</script>

	<!-- CSS kustom (hanya yang tidak bisa di-Tailwind) -->
	<link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-primary text-text-main min-h-screen antialiased">

	<!-- ============================================================ -->
	<!-- HEADER                                                       -->
	<!-- ============================================================ -->
	<header class="sticky top-0 z-10 flex flex-wrap items-center gap-4 bg-secondary px-4 py-3">
		<h1 class="whitespace-nowrap text-xl font-bold">
			<i class="fa-solid fa-clapperboard"></i>
			Dracin<span class="text-accent">Stream</span>
		</h1>

		<div class="relative flex min-w-[160px] flex-1 items-center">
			<i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 text-sm text-text-sub"></i>
			<input
				type="search"
				id="searchInput"
				placeholder="Cari drama China..."
				autocomplete="off"
				class="w-full rounded-full border border-white/10 bg-card py-2.5 pl-10 pr-4 text-sm text-text-main outline-none transition-colors placeholder:text-text-sub focus:border-accent"
			>
		</div>

		<div class="flex gap-2">
			<button
				id="btnProfile"
				aria-label="Profile"
				class="flex h-10 w-10 items-center justify-center rounded-full bg-white/5 text-base transition hover:bg-white/10 active:scale-95"
			>
				<i class="fa-solid fa-user"></i>
			</button>
			<button
				id="btnSettings"
				aria-label="Pengaturan"
				class="flex h-10 w-10 items-center justify-center rounded-full bg-white/5 text-base transition hover:bg-white/10 active:scale-95"
			>
				<i class="fa-solid fa-gear"></i>
			</button>
		</div>
	</header>

	<!-- ============================================================ -->
	<!-- MAIN                                                         -->
	<!-- ============================================================ -->
	<main id="app" class="mx-auto max-w-[1400px] p-4">
		<div id="loadingIndicator" class="py-10 text-center text-text-sub">
			<i class="fa-solid fa-spinner fa-spin"></i> Memuat...
		</div>
	</main>

	<!-- ============================================================ -->
	<!-- PLAYER MODAL                                                 -->
	<!-- ============================================================ -->
	<div id="playerModal" class="fixed inset-0 z-[150] hidden items-start justify-center overflow-y-auto bg-black/95 animate-fadeIn">
		<div class="relative min-h-screen w-full max-w-[900px] bg-primary animate-slideUp">

			<!-- Toolbar melayang di atas video -->
			<div class="sticky top-0 z-[5] flex gap-2 bg-black/75 px-3 py-2.5 backdrop-blur-md animate-slideDown">
				<div class="relative flex flex-1 items-center">
					<i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 text-xs text-white/60"></i>
					<input
						type="search"
						id="playerSearchInput"
						placeholder="Cari dalam drama..."
						class="w-full rounded-full border border-white/15 bg-white/10 py-2 pl-9 pr-4 text-sm text-white outline-none placeholder:text-white/50 focus:border-accent"
					>
				</div>

				<div class="relative">
					<select
						id="playerCategorySelect"
						class="appearance-none rounded-lg border border-white/15 bg-white/10 py-2 pl-3 pr-9 text-xs text-white outline-none focus:border-accent"
					>
						<option value="">Semua Kategori</option>
						<option value="romance">Romance</option>
						<option value="historical">Historical</option>
						<option value="modern">Modern</option>
						<option value="fantasy">Fantasy</option>
						<option value="thriller">Thriller</option>
					</select>
					<i class="fa-solid fa-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs text-white/60"></i>
				</div>

				<div class="relative">
					<select
						id="playerFilterSelect"
						class="appearance-none rounded-lg border border-white/15 bg-white/10 py-2 pl-3 pr-9 text-xs text-white outline-none focus:border-accent"
					>
						<option value="latest">Terbaru</option>
						<option value="popular">Populer</option>
						<option value="rating">Rating</option>
					</select>
					<i class="fa-solid fa-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs text-white/60"></i>
				</div>
			</div>

			<video id="videoPlayer" controls playsinline class="block max-h-[60vh] w-full bg-black"></video>

			<!-- Info drama -->
			<div id="playerDramaInfo" class="bg-secondary px-4 py-4 animate-fadeSlide">
				<h2 id="playerDramaTitle" class="mb-2.5 text-lg font-semibold">—</h2>

				<div class="mb-3.5 flex flex-wrap gap-3 text-xs text-text-sub">
					<span><i class="fa-solid fa-list-ol"></i> <span id="playerEpisodeCount">0</span> Episode</span>
					<span><i class="fa-solid fa-masks-theater"></i> <span id="playerGenre">—</span></span>
					<span><i class="fa-solid fa-clock"></i> <span id="playerDuration">—</span></span>
					<span><i class="fa-solid fa-eye"></i> <span id="playerViews">0</span> tayangan</span>
				</div>

				<div class="mb-3.5 flex flex-wrap items-center gap-2.5">
					<button
						id="btnLike"
						class="action-btn flex items-center gap-1.5 rounded-full bg-white/5 px-3.5 py-2 text-sm transition hover:bg-white/10 active:scale-95"
					>
						<i class="fa-regular fa-heart"></i>
						<span>Like</span>
					</button>
					<button
						id="btnSave"
						class="action-btn flex items-center gap-1.5 rounded-full bg-white/5 px-3.5 py-2 text-sm transition hover:bg-white/10 active:scale-95"
					>
						<i class="fa-regular fa-bookmark"></i>
						<span>Simpan</span>
					</button>

					<div class="ml-auto flex gap-2 max-[480px]:ml-0 max-[480px]:w-full max-[480px]:justify-between">
						<button
							id="btnPrevEp"
							disabled
							class="rounded-lg bg-white/10 px-3.5 py-2 text-xs transition enabled:hover:bg-accent disabled:cursor-not-allowed disabled:opacity-40"
						>
							<i class="fa-solid fa-backward-step"></i> Sebelumnya
						</button>
						<button
							id="btnNextEp"
							disabled
							class="rounded-lg bg-white/10 px-3.5 py-2 text-xs transition enabled:hover:bg-accent disabled:cursor-not-allowed disabled:opacity-40"
						>
							Selanjutnya <i class="fa-solid fa-forward-step"></i>
						</button>
					</div>
				</div>

				<p id="playerDescription" class="text-sm leading-relaxed text-text-sub">—</p>
			</div>

			<!-- Episode lain -->
			<div class="border-t border-white/5 px-4 py-4">
				<h3 class="mb-3 text-base font-semibold"><i class="fa-solid fa-layer-group"></i> Episode Lain</h3>
				<div id="episodeList" class="flex gap-2 overflow-x-auto pb-1 [scrollbar-width:thin]"></div>
			</div>

			<!-- Drama relevan -->
			<div class="border-t border-white/5 px-4 py-4">
				<h3 class="mb-3 text-base font-semibold"><i class="fa-solid fa-fire"></i> Drama Relevan</h3>
				<div id="relatedGrid" class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6"></div>
			</div>

			<button
				id="btnClosePlayer"
				aria-label="Tutup"
				class="absolute right-2.5 top-2.5 z-10 flex h-9 w-9 items-center justify-center rounded-full bg-black/60 text-white transition hover:bg-black/80"
			>
				<i class="fa-solid fa-xmark"></i>
			</button>
		</div>
	</div>

	<!-- ============================================================ -->
	<!-- MODAL PROFILE                                                -->
	<!-- ============================================================ -->
	<div id="modalProfile" class="modal-overlay fixed inset-0 z-[200] hidden items-center justify-center bg-black/70 p-4 backdrop-blur-sm animate-fadeIn">
		<div class="max-h-[90vh] w-full max-w-[520px] overflow-y-auto rounded-xl bg-secondary shadow-2xl animate-slideUp">

			<div class="sticky top-0 z-[2] flex items-center justify-between border-b border-white/10 bg-secondary px-5 py-4">
				<h2 class="text-lg font-semibold"><i class="fa-solid fa-user"></i> Profile</h2>
				<button data-close="modalProfile" class="rounded-md px-2.5 py-1 transition hover:bg-white/10">
					<i class="fa-solid fa-xmark"></i>
				</button>
			</div>

			<div class="flex items-center gap-4 px-5 py-4 max-[480px]:flex-col max-[480px]:text-center">
				<div class="relative shrink-0">
					<img
						id="profileAvatar"
						src=""
						alt="Avatar"
						class="h-20 w-20 rounded-full border-2 border-accent bg-card object-cover"
					>
					<label
						for="avatarUpload"
						class="absolute -bottom-0.5 -right-0.5 flex h-7 w-7 cursor-pointer items-center justify-center rounded-full bg-accent text-xs"
					>
						<i class="fa-solid fa-camera"></i>
					</label>
					<input type="file" id="avatarUpload" accept="image/*" hidden>
				</div>
				<div class="flex-1">
					<label class="mb-1.5 block text-xs text-text-sub">Nama</label>
					<input
						type="text"
						id="profileNameInput"
						placeholder="Nama kamu"
						class="w-full rounded-lg border border-white/10 bg-card px-3.5 py-2.5 text-sm text-text-main outline-none focus:border-accent"
					>
					<button
						id="btnSaveProfileName"
						class="mt-2 rounded-lg bg-accent px-4 py-2.5 text-sm font-semibold text-white transition active:scale-95"
					>
						<i class="fa-solid fa-check"></i> Simpan Nama
					</button>
				</div>
			</div>

			<div class="flex gap-1 overflow-x-auto px-4 pt-3 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" data-tabs="profile">
				<button data-tab="history" class="tab-btn active relative whitespace-nowrap rounded-t-lg px-3.5 py-2 text-sm text-text-sub transition"><i class="fa-solid fa-clock-rotate-left"></i> Histori</button>
				<button data-tab="likes" class="tab-btn relative whitespace-nowrap rounded-t-lg px-3.5 py-2 text-sm text-text-sub transition"><i class="fa-solid fa-heart"></i> Like</button>
				<button data-tab="saved" class="tab-btn relative whitespace-nowrap rounded-t-lg px-3.5 py-2 text-sm text-text-sub transition"><i class="fa-solid fa-bookmark"></i> Simpan</button>
				<button data-tab="stats" class="tab-btn relative whitespace-nowrap rounded-t-lg px-3.5 py-2 text-sm text-text-sub transition"><i class="fa-solid fa-chart-column"></i> Grafik</button>
				<button data-tab="data" class="tab-btn relative whitespace-nowrap rounded-t-lg px-3.5 py-2 text-sm text-text-sub transition"><i class="fa-solid fa-database"></i> Data</button>
			</div>

			<div class="px-5 pb-6 pt-4">
				<div data-panel="history" class="tab-panel active animate-fadeSlide" id="panelHistory">
					<p class="py-10 text-center text-sm text-text-sub">Belum ada histori.</p>
				</div>
				<div data-panel="likes" class="tab-panel hidden animate-fadeSlide" id="panelLikes">
					<p class="py-10 text-center text-sm text-text-sub">Belum ada yang di-like.</p>
				</div>
				<div data-panel="saved" class="tab-panel hidden animate-fadeSlide" id="panelSaved">
					<p class="py-10 text-center text-sm text-text-sub">Belum ada yang disimpan.</p>
				</div>
				<div data-panel="stats" class="tab-panel hidden animate-fadeSlide" id="panelStats">
					<canvas id="statsChart" width="400" height="200" class="w-full"></canvas>
				</div>
				<div data-panel="data" class="tab-panel hidden animate-fadeSlide" id="panelData">
					<div class="flex flex-col gap-2.5">
						<button id="btnExportData" class="rounded-lg bg-white/5 px-4 py-2.5 text-sm font-semibold text-text-main transition active:scale-95">
							<i class="fa-solid fa-file-export"></i> Export Data
						</button>
						<label for="importDataInput" class="cursor-pointer rounded-lg bg-white/5 px-4 py-2.5 text-center text-sm font-semibold text-text-main transition active:scale-95">
							<i class="fa-solid fa-file-import"></i> Import Data
						</label>
						<input type="file" id="importDataInput" accept="application/json" hidden>
						<button id="btnDeleteData" class="rounded-lg bg-red-500/15 px-4 py-2.5 text-sm font-semibold text-red-400 transition active:scale-95">
							<i class="fa-solid fa-trash"></i> Hapus Semua Data
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- ============================================================ -->
	<!-- MODAL SETTINGS                                               -->
	<!-- ============================================================ -->
	<div id="modalSettings" class="modal-overlay fixed inset-0 z-[200] hidden items-center justify-center bg-black/70 p-4 backdrop-blur-sm animate-fadeIn">
		<div class="max-h-[90vh] w-full max-w-[520px] overflow-y-auto rounded-xl bg-secondary shadow-2xl animate-slideUp">

			<div class="sticky top-0 z-[2] flex items-center justify-between border-b border-white/10 bg-secondary px-5 py-4">
				<h2 class="text-lg font-semibold"><i class="fa-solid fa-gear"></i> Pengaturan</h2>
				<button data-close="modalSettings" class="rounded-md px-2.5 py-1 transition hover:bg-white/10">
					<i class="fa-solid fa-xmark"></i>
				</button>
			</div>

			<div class="flex gap-1 overflow-x-auto px-4 pt-3 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" data-tabs="settings">
				<button data-tab="appearance" class="tab-btn active relative whitespace-nowrap rounded-t-lg px-3.5 py-2 text-sm text-text-sub transition"><i class="fa-solid fa-palette"></i> Tampilan</button>
				<button data-tab="playback" class="tab-btn relative whitespace-nowrap rounded-t-lg px-3.5 py-2 text-sm text-text-sub transition"><i class="fa-solid fa-sliders"></i> Pemutaran</button>
				<button data-tab="data" class="tab-btn relative whitespace-nowrap rounded-t-lg px-3.5 py-2 text-sm text-text-sub transition"><i class="fa-solid fa-database"></i> Data</button>
			</div>

			<div class="px-5 pb-6 pt-4">
				<!-- Tampilan -->
				<div data-panel="appearance" class="tab-panel active animate-fadeSlide">
					<div class="mb-4">
						<label class="mb-1.5 block text-xs text-text-sub">Tema</label>
						<div class="relative">
							<select id="settingTheme" class="w-full appearance-none rounded-lg border border-white/10 bg-card py-2.5 pl-3.5 pr-10 text-sm text-text-main outline-none focus:border-accent">
								<option value="dark">Gelap</option>
								<option value="light">Terang</option>
								<option value="amoled">AMOLED</option>
							</select>
							<i class="fa-solid fa-chevron-down pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-text-sub"></i>
						</div>
					</div>

					<div class="mb-4">
						<label class="mb-1.5 block text-xs text-text-sub">Warna Aksen (kalem & glossy)</label>
						<div id="accentSwatches" class="flex flex-wrap gap-2.5">
							<button class="accent-swatch h-8 w-8 rounded-full border-2 border-transparent transition hover:scale-110" data-color="#7c8fb8" style="--sw:#7c8fb8"></button>
							<button class="accent-swatch h-8 w-8 rounded-full border-2 border-transparent transition hover:scale-110" data-color="#8fa88c" style="--sw:#8fa88c"></button>
							<button class="accent-swatch h-8 w-8 rounded-full border-2 border-transparent transition hover:scale-110" data-color="#b89a7c" style="--sw:#b89a7c"></button>
							<button class="accent-swatch h-8 w-8 rounded-full border-2 border-transparent transition hover:scale-110" data-color="#a88cb8" style="--sw:#a88cb8"></button>
							<button class="accent-swatch h-8 w-8 rounded-full border-2 border-transparent transition hover:scale-110" data-color="#8ca8b8" style="--sw:#8ca8b8"></button>
							<button class="accent-swatch h-8 w-8 rounded-full border-2 border-transparent transition hover:scale-110" data-color="#b88c9a" style="--sw:#b88c9a"></button>
						</div>
					</div>

					<div class="mb-4">
						<label class="mb-1.5 block text-xs text-text-sub">Ukuran Font <span id="fontSizeVal" class="text-text-main">16px</span></label>
						<input type="range" id="settingFontSize" min="12" max="22" value="16" class="range-slider w-full">
					</div>

					<div class="mb-4">
						<label class="mb-1.5 block text-xs text-text-sub">Jenis Font</label>
						<div class="relative">
							<select id="settingFontFamily" class="w-full appearance-none rounded-lg border border-white/10 bg-card py-2.5 pl-3.5 pr-10 text-sm text-text-main outline-none focus:border-accent">
								<option value="system-ui, sans-serif">System Default</option>
								<option value="'Segoe UI', sans-serif">Segoe UI</option>
								<option value="'Roboto', sans-serif">Roboto</option>
								<option value="'Georgia', serif">Georgia</option>
								<option value="'Courier New', monospace">Courier New</option>
								<option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
							</select>
							<i class="fa-solid fa-chevron-down pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-text-sub"></i>
						</div>
					</div>

					<div class="mb-4">
						<label class="mb-1.5 block text-xs text-text-sub">Ketebalan Font <span id="fontWeightVal" class="text-text-main">400</span></label>
						<input type="range" id="settingFontWeight" min="300" max="800" step="100" value="400" class="range-slider w-full">
					</div>

					<div class="mb-4 flex items-center justify-between">
						<label class="text-xs text-text-sub">Animasi</label>
						<label class="toggle-switch relative inline-block h-6 w-11 shrink-0">
							<input type="checkbox" id="settingAnimations" checked class="absolute h-0 w-0 opacity-0">
							<span class="slider absolute inset-0 cursor-pointer rounded-full bg-white/15 transition"></span>
						</label>
					</div>

					<div class="mb-4 flex items-center justify-between">
						<label class="text-xs text-text-sub">Efek Suara</label>
						<label class="toggle-switch relative inline-block h-6 w-11 shrink-0">
							<input type="checkbox" id="settingSound" class="absolute h-0 w-0 opacity-0">
							<span class="slider absolute inset-0 cursor-pointer rounded-full bg-white/15 transition"></span>
						</label>
					</div>

					<div class="mb-4 flex items-center justify-between">
						<label class="text-xs text-text-sub">Efek Getar</label>
						<label class="toggle-switch relative inline-block h-6 w-11 shrink-0">
							<input type="checkbox" id="settingVibration" class="absolute h-0 w-0 opacity-0">
							<span class="slider absolute inset-0 cursor-pointer rounded-full bg-white/15 transition"></span>
						</label>
					</div>
				</div>

				<!-- Pemutaran -->
				<div data-panel="playback" class="tab-panel hidden animate-fadeSlide">
					<div class="mb-4">
						<label class="mb-1.5 block text-xs text-text-sub">Volume <span id="volumeVal" class="text-text-main">100%</span></label>
						<input type="range" id="settingVolume" min="0" max="100" value="100" class="range-slider w-full">
					</div>
					<div class="mb-4">
						<label class="mb-1.5 block text-xs text-text-sub">Kecerahan <span id="brightnessVal" class="text-text-main">100%</span></label>
						<input type="range" id="settingBrightness" min="50" max="100" value="100" class="range-slider w-full">
					</div>
				</div>

				<!-- Data -->
				<div data-panel="data" class="tab-panel hidden animate-fadeSlide">
					<div class="flex flex-col gap-2.5">
						<button id="btnExportSettings" class="rounded-lg bg-white/5 px-4 py-2.5 text-sm font-semibold text-text-main transition active:scale-95">
							<i class="fa-solid fa-file-export"></i> Export
						</button>
						<label for="importSettingsInput" class="cursor-pointer rounded-lg bg-white/5 px-4 py-2.5 text-center text-sm font-semibold text-text-main transition active:scale-95">
							<i class="fa-solid fa-file-import"></i> Import
						</label>
						<input type="file" id="importSettingsInput" accept="application/json" hidden>
						<button id="btnDeleteSettings" class="rounded-lg bg-red-500/15 px-4 py-2.5 text-sm font-semibold text-red-400 transition active:scale-95">
							<i class="fa-solid fa-trash"></i> Hapus Data
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- ============================================================ -->
	<!-- SCRIPT                                                       -->
