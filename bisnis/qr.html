<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mengarahkan...</title>
	
	<!-- Memuat Font & Tailwind CSS -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	
	<!-- Konfigurasi Tailwind -->
	<script>
		tailwind.config = {
			darkMode: 'class',
			theme: {
				extend: {
					fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
				}
			}
		}
	</script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4 antialiased transition-colors duration-500 relative">
	
	<!-- Tombol Tema (Light/Dark) -->
	<button onclick="toggleTheme()" class="absolute top-6 right-6 p-3 rounded-full bg-white dark:bg-gray-800 text-gray-600 dark:text-yellow-400 shadow-sm hover:shadow-md border border-gray-200 dark:border-gray-700 transition-all duration-300 focus:outline-none">
		<svg id="moon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
			<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
		</svg>
		<svg id="sun" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
			<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
		</svg>
	</button>

	<!-- Kartu Loading -->
	<div class="bg-white dark:bg-gray-800 p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-gray-100 dark:border-gray-700 text-center max-w-sm w-full mx-4 transition-colors duration-500">
		<div id="loading-spinner" class="inline-block w-12 h-12 mb-4 border-4 border-gray-200 dark:border-gray-600 border-t-blue-600 dark:border-t-blue-400 rounded-full animate-spin"></div>
		<h2 id="pesan-status" class="text-xl font-semibold text-gray-800 dark:text-gray-100 mt-2">
			Memuat ulasan...
		</h2>
		<p id="pesan-sub" class="text-sm text-gray-500 dark:text-gray-400 mt-2 hidden">
			Mohon periksa kembali tautan Anda.
		</p>
	</div>

	<!-- Skrip UI -->
	<script>
		function toggleTheme() { document.documentElement.classList.toggle('dark'); }
		function showError(message) {
			document.getElementById("loading-spinner").style.display = "none";
			const statusEl = document.getElementById("pesan-status");
			statusEl.innerHTML = message;
			statusEl.classList.add("text-red-500", "dark:text-red-400");
			document.getElementById("pesan-sub").classList.remove("hidden");
		}
	</script>

	<!-- Skrip Logika Firebase -->
	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
		import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

		const firebaseConfig = {
			apiKey: "AIzaSyBZJQWPSzG_oskY2wXDm1bV_WUQ4v2TDBQ",
			authDomain: "test-795cb.firebaseapp.com",
			projectId: "test-795cb",
			storageBucket: "test-795cb.firebasestorage.app",
			messagingSenderId: "385044700612",
			appId: "1:385044700612:web:f4da4cb9ae626c72f69891",
			measurementId: "G-17RG3Z3DSX"
		};
		const app = initializeApp(firebaseConfig);
		const db = getFirestore(app);

		const params = new URLSearchParams(window.location.search);
		const cardId = params.get('id');

		if (cardId) {
			const docRef = doc(db, "kartu_review", cardId);
			getDoc(docRef).then((docSnap) => {
				if (docSnap.exists()) {
					window.location.replace(docSnap.data().url);
				} else {
					showError("Kartu belum diaktivasi");
				}
			}).catch(() => {
				showError("Gagal terhubung ke sistem");
			});
		} else {
			showError("QR Code tidak valid");
		}
	</script>
</body>
</html>
