<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cetak Massal QR Code</title>
	
	<!-- Memuat Font & Tailwind CSS -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	
	<!-- Konfigurasi Tailwind -->
	<script>
		tailwind.config = {
			darkMode: 'class',
			theme: {
				extend: {
					fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
				}
			}
		}
	</script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen p-6 antialiased transition-colors duration-500 relative">
	
	<!-- Tombol Tema (Light/Dark) -->
	<button onclick="toggleTheme()" class="absolute top-6 right-6 p-3 rounded-full bg-white dark:bg-gray-800 text-gray-600 dark:text-yellow-400 shadow-sm hover:shadow-md border border-gray-200 dark:border-gray-700 transition-all duration-300 focus:outline-none">
		<svg id="moon-qr" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
			<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
		</svg>
		<svg id="sun-qr" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
			<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
		</svg>
	</button>

	<div class="max-w-4xl mx-auto">
		<!-- Header Kartu Kontrol -->
		<div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-gray-100 dark:border-gray-700 mb-8 transition-colors duration-500">
			<h2 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight mb-2">
				Generator QR Code Massal
			</h2>
			<p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
				Domain utama: <code class="bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-blue-600 dark:text-blue-400">https://webstockid.github.io/qr.html?id=</code>
			</p>
			
			<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-start">
				<!-- Input Angka Awal -->
				<div>
					<label for="startId" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
						Mulai dari ID
					</label>
					<input type="number" id="startId" value="1" min="1" 
						class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700/50 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all">
					<p id="infoStatus" class="text-xs mt-2 font-medium text-gray-500 dark:text-gray-400">
						Menghubungkan ke database...
					</p>
				</div>

				<!-- Input Jumlah -->
				<div>
					<label for="jumlah" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
						Jumlah Cetak
					</label>
					<input type="number" id="jumlah" value="10" min="1" max="100" 
						class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700/50 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all">
				</div>

				<!-- Tombol Eksekusi -->
				<div class="pt-6">
					<button onclick="generateBulkQR()" 
						class="w-full bg-gray-900 dark:bg-blue-600 hover:bg-gray-800 dark:hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md transition-all active:scale-[0.98]">
						Buat QR Code
					</button>
				</div>
			</div>
		</div>

		<!-- Container Hasil Grid QR (Format 2x2 dst) -->
		<div id="qrContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6 justify-center"></div>
	</div>

	<!-- Skrip UI & Logika Firebase -->
	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
		import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

		const firebaseConfig = {
			apiKey: "AIzaSyBZJQWPSzG_oskY2wXDm1bV_WUQ4v2TDBQ",
			authDomain: "test-795cb.firebaseapp.com",
			projectId: "test-795cb",
			storageBucket: "test-795cb.firebasestorage.app",
			messagingSenderId: "385044700612",
			appId: "1:385044700612:web:f4da4cb9ae626c72f69891",
			measurementId: "G-17RG3Z3DSX"
		};
		
		const app = initializeApp(firebaseConfig);
		const db = getFirestore(app);

		// Menjadikan fungsi bisa dipanggil oleh onclick HTML
		window.toggleTheme = () => { 
			document.documentElement.classList.toggle('dark'); 
		};

		// Fungsi otomatis mencari ID tertinggi di Database
		async function cekDatabase() {
			const infoStatus = document.getElementById('infoStatus');
			
			try {
				infoStatus.innerHTML = "Memeriksa ID terakhir...";
				infoStatus.classList.add("text-blue-500", "animate-pulse");

				const querySnapshot = await getDocs(collection(db, "kartu_review"));
				let maxId = 0;

				// Looping semua dokumen untuk mencari angka terbesar
				querySnapshot.forEach((doc) => {
					const num = parseInt(doc.id, 10);
					if (!isNaN(num) && num > maxId) {
						maxId = num;
					}
				});

				const nextId = maxId + 1;
				document.getElementById('startId').value = nextId;
				
				infoStatus.innerHTML = `Terpakai: ${maxId > 0 ? String(maxId).padStart(3, '0') : 'Belum ada'}. Aman mulai dari ${String(nextId).padStart(3, '0')}`;
				infoStatus.classList.remove("text-blue-500", "animate-pulse");
				infoStatus.classList.add("text-emerald-600", "dark:text-emerald-400");
				
				// Langsung generate preview pertama kali
				window.generateBulkQR();

			} catch (error) {
				infoStatus.innerHTML = "Gagal memuat dari database.";
				infoStatus.classList.remove("text-blue-500", "animate-pulse");
				infoStatus.classList.add("text-red-500");
				console.error("Error mengambil data:", error);
			}
		}

		window.generateBulkQR = () => {
			const container = document.getElementById('qrContainer');
			const startId = parseInt(document.getElementById('startId').value);
			const jumlah = parseInt(document.getElementById('jumlah').value);
			const domain = "https://webstockid.github.io/qr.html?id=";
			
			if (isNaN(startId) || isNaN(jumlah) || startId < 1 || jumlah < 1) {
				alert("Mohon masukkan angka yang valid!");
				return;
			}
			
			container.innerHTML = ""; 

			const endId = startId + jumlah - 1;
			for (let i = startId; i <= endId; i++) {
				const idFormat = String(i).padStart(3, '0');
				const fullUrl = encodeURIComponent(domain + idFormat);
				const qrImageSrc = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${fullUrl}`;
				
				const item = document.createElement('div');
				item.className = 'bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center flex flex-col items-center transition-colors duration-500';
				item.innerHTML = `
					<div class="bg-gray-50 dark:bg-gray-900 p-3 rounded-xl mb-3 border border-gray-100 dark:border-gray-800">
						<img src="${qrImageSrc}" alt="QR ${idFormat}" class="w-32 h-32 object-contain block mx-auto">
					</div>
					<span class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-1">ID Kartu</span>
					<p class="text-base font-bold text-gray-800 dark:text-gray-100">${idFormat}</p>
				`;
				container.appendChild(item);
			}
		};

		// Jalankan pengecekan database saat halaman dimuat
		cekDatabase();
	</script>
</body>
</html>
