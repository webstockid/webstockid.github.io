<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cetak Massal QR Code</title>
	
	<!-- Memuat Font & Tailwind CSS -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	
	<!-- Konfigurasi Tailwind -->
	<script>
		tailwind.config = {
			darkMode: 'class',
			theme: {
				extend: {
					fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
				}
			}
		}
	</script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen p-6 antialiased transition-colors duration-500 relative">
	
	<!-- Tombol Tema (Light/Dark) -->
	<button onclick="toggleTheme()" class="absolute top-6 right-6 p-3 rounded-full bg-white dark:bg-gray-800 text-gray-600 dark:text-yellow-400 shadow-sm hover:shadow-md border border-gray-200 dark:border-gray-700 transition-all duration-300 focus:outline-none">
		<svg id="moon-qr" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
			<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
		</svg>
		<svg id="sun-qr" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
			<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
		</svg>
	</button>

	<div class="max-w-3xl mx-auto">
		<!-- Header Kartu Kontrol -->
		<div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-gray-100 dark:border-gray-700 mb-8 transition-colors duration-500">
			<h2 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight mb-2">
				Generator QR Code Massal
			</h2>
			<p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
				Sistem akan otomatis melanjutkan ID yang belum terpakai. Klik pada gambar QR untuk mengunduh.
			</p>
			
			<div class="grid grid-cols-1 sm:grid-cols-2 gap-6 items-end">
				<!-- Input Jumlah -->
				<div>
					<label for="jumlah" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
						Jumlah Cetak
					</label>
					<div class="relative">
						<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
							<svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
							</svg>
						</div>
						<input type="number" id="jumlah" value="5" min="1" max="100" 
							class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700/50 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all font-semibold">
					</div>
				</div>

				<!-- Tombol Eksekusi -->
				<div>
					<button onclick="generateBulkQR()" id="btnGenerate"
						class="w-full bg-emerald-500 dark:bg-blue-500 hover:bg-cyan-500 dark:hover:bg-teal-500 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md transition-all active:scale-[0.98] flex justify-center items-center gap-2">
						Buat QR Code
					</button>
				</div>
			</div>
		</div>

		<!-- Container Hasil Grid QR (Format presisi 2x2 sejajar) -->
		<div id="qrContainer" class="grid grid-cols-2 gap-6 justify-center"></div>
	</div>

	<!-- Skrip UI & Logika Generator -->
	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
		import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

		const firebaseConfig = {
			apiKey: "AIzaSyBZJQWPSzG_oskY2wXDm1bV_WUQ4v2TDBQ",
			authDomain: "test-795cb.firebaseapp.com",
			projectId: "test-795cb",
			storageBucket: "test-795cb.firebasestorage.app",
			messagingSenderId: "385044700612",
			appId: "1:385044700612:web:f4da4cb9ae626c72f69891",
			measurementId: "G-17RG3Z3DSX"
		};
		
		const app = initializeApp(firebaseConfig);
		const db = getFirestore(app);

		window.toggleTheme = () => { 
			document.documentElement.classList.toggle('dark'); 
		};

		// Fungsi untuk menggabungkan QR dan Teks lalu mengunduhnya
		window.downloadQR = (idFormat, qrUrl) => {
			const canvas = document.createElement('canvas');
			const ctx = canvas.getContext('2d');
			
			// Ukuran kanvas final (Gambar QR 300x300 + Ruang teks 50px di bawahnya)
			const imgSize = 300;
			const textSpace = 35;
			
			canvas.width = imgSize;
			canvas.height = imgSize + textSpace;

			// Isi latar belakang dengan warna putih penuh
			ctx.fillStyle = "#ffffff";
			ctx.fillRect(0, 0, canvas.width, canvas.height);

			// Memuat gambar dari server
			const img = new Image();
			img.crossOrigin = "Anonymous"; // Mencegah error keamanan saat mengunduh dari API pihak ketiga
			
			img.onload = () => {
				// 1. Gambar QR Code
				ctx.drawImage(img, 0, 0, imgSize, imgSize);
				
				// 2. Gambar Teks ID Kartu
				ctx.fillStyle = "#000000";
				ctx.font = "bold 24px sans-serif";
				ctx.textAlign = "center";
				ctx.fillText("ID " + idFormat, canvas.width / 2, imgSize + 30);
				
				// 3. Proses Pengunduhan
				const link = document.createElement('a');
				link.download = `QR_Kartu_${idFormat}.png`;
				link.href = canvas.toDataURL("image/png");
				link.click();
			};
			
			// Ubah resolusi gambar API menjadi 300x300 agar tajam saat dicetak
			img.src = qrUrl.replace("150x150", "300x300");
		};

		window.generateBulkQR = async () => {
			const container = document.getElementById('qrContainer');
			const jumlah = parseInt(document.getElementById('jumlah').value);
			const domain = "https://webstockid.github.io/qr.html?id=";
			const btn = document.getElementById('btnGenerate');
			
			if (isNaN(jumlah) || jumlah < 1) {
				alert("Mohon masukkan jumlah cetak yang valid!");
				return;
			}
			
			const originalText = btn.innerHTML;
			btn.innerHTML = "Mengecek Database...";
			btn.disabled = true;
			container.innerHTML = ""; 

			try {
				const querySnapshot = await getDocs(collection(db, "kartu_review"));
				let maxId = 0;

				querySnapshot.forEach((doc) => {
					const num = parseInt(doc.id, 10);
					if (!isNaN(num) && num > maxId) {
						maxId = num;
					}
				});

				const startId = maxId + 1;
				const endId = startId + jumlah - 1;

				btn.innerHTML = "Memproses Gambar...";

				for (let i = startId; i <= endId; i++) {
					const idFormat = String(i).padStart(3, '0');
					const fullUrl = encodeURIComponent(domain + idFormat);
					const qrImageSrc = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${fullUrl}`;
					
					const item = document.createElement('div');
					item.className = 'bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center flex flex-col items-center transition-colors duration-500';
					
					// Struktur elemen dibuat interaktif (Klik & Hover Download)
					item.innerHTML = `
						<div onclick="downloadQR('${idFormat}', '${qrImageSrc}')" title="Unduh QR Code" 
							class="bg-gray-50 dark:bg-gray-900 p-3 rounded-xl mb-3 border border-gray-100 dark:border-gray-800 w-full flex justify-center relative group cursor-pointer overflow-hidden">
							
							<img src="${qrImageSrc}" alt="QR ${idFormat}" class="w-32 h-32 object-contain block transition-transform duration-300 group-hover:scale-110">
							
							<!-- Overlay Icon Download -->
							<div class="absolute inset-0 bg-blue-600/80 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-xl">
								<svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
								</svg>
							</div>
						</div>
						<span class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-1">ID Kartu Baru</span>
						<p class="text-base font-bold text-gray-800 dark:text-gray-100">${idFormat}</p>
					`;
					container.appendChild(item);
				}

			} catch (error) {
				alert("Gagal terhubung ke database. Pastikan koneksi internet stabil.");
				console.error("Error:", error);
			} finally {
				btn.innerHTML = originalText;
				btn.disabled = false;
			}
		};
	</script>
</body>
</html>
